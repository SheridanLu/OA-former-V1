version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mochu-mysql
    environment:
      MYSQL_ROOT_PASSWORD: mochu@2026
      MYSQL_DATABASE: mochu_oa
      MYSQL_CHARSET: utf8mb4
      MYSQL_COLLATION: utf8mb4_general_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docs/sql/V3.2_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    container_name: mochu-redis
    command: redis-server --requirepass mochu@2026
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  minio:
    image: minio/minio:latest
    container_name: mochu-minio
    environment:
      MINIO_ROOT_USER: mochu_admin
      MINIO_ROOT_PASSWORD: mochu@2026
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mochu-backend
    ports:
      - "9090:9090"
    depends_on:
      - mysql
      - redis
      - minio
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mochu_oa?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_PASSWORD: mochu@2026
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: mochu@2026
      MINIO_ENDPOINT: http://minio:9000

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: mochu-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
  redis-data:
  minio-data:
